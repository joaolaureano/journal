name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  deploy:
    needs: test
    # Only from main, and only once the role exists (the variable is set after
    # the first tofu apply). Forks without it just run the tests.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - run: ./deploy/build.sh
      - run: cd build && zip -qr ../journal.zip .
      - name: Publish the function code
        env:
          FUNCTION: ${{ vars.JOURNAL_FUNCTION || 'journal-build' }}
        run: |
          aws lambda update-function-code --function-name "$FUNCTION" \
            --zip-file fileb://journal.zip --query CodeSha256 --output text
          aws lambda wait function-updated --function-name "$FUNCTION"
