# Fontes deste jornal. Num fork, troque pelas suas.
# Fontes, na ordem em que são lidas. Em URLs repetidas, vale a primeira fonte.

# Fuso que define a data de cada edição (padrão: America/Sao_Paulo).
# Chave de topo: precisa vir antes de qualquer [[sources]].
