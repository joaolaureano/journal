[project]
name = "journal"
version = "0.1.0"
description = "Portal estático de notícias gerado a partir de fontes configuráveis."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "feedparser>=6.0.14",
    "tzdata>=2026.6",
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]  # S3 storage; already present in the AWS Lambda runtime

[project.scripts]
journal = "journal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/journal"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
# ruff also formats Markdown; keep it off skills and OpenSpec artifacts
extend-exclude = [".agents", ".claude", "openspec"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
