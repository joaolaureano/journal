AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Journal: uma edição estática por dia. Lambda agendada gera o site e grava num
  bucket S3 privado, servido pelo CloudFront.

Parameters:
  ScheduleExpression:
    Type: String
    Default: cron(0 8 * * ? *)
    Description: Quando gerar a edição (sintaxe do EventBridge Scheduler).
  ScheduleTimezone:
    Type: String
    Default: America/Sao_Paulo
    Description: Fuso do agendamento; deve bater com o timezone do journal.toml.

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled  # histórico também de index.html, editions.json e seen.json
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${AWS::StackName} journal
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized: respeita o Cache-Control que o journal grava
          # (5 min para index.html e manifestos, 1 ano para edições).
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadsSite
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  BuildFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Gera a edição do dia e publica no bucket do site.
      CodeUri: ../build
      Handler: journal.aws_lambda.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 600
      Environment:
        Variables:
          JOURNAL_BUCKET: !Ref SiteBucket
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref SiteBucket
      EventInvokeConfig:
        MaximumRetryAttempts: 1  # uma nova tentativa vira, no máximo, uma revisão a mais
      Events:
        Daily:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: !Ref ScheduleExpression
            ScheduleExpressionTimezone: !Ref ScheduleTimezone

  BuildFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${BuildFunction}
      RetentionInDays: 14

Outputs:
  SiteUrl:
    Description: Endereço do jornal
    Value: !Sub https://${Distribution.DomainName}
  BucketName:
    Value: !Ref SiteBucket
  FunctionName:
    Description: Para rodar na hora (veja deploy/README.md)
    Value: !Ref BuildFunction
